<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set New Password — StockAI</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080e1a;color:#e5efff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#103447 0%,#080e1a 55%);padding:1rem}main{max-width:430px;margin:8vh auto 2rem;padding:2rem;background:#101b2b;border:1px solid #244258;border-radius:16px;box-shadow:0 20px 80px rgba(0,0,0,.25)}
a{color:#47d8cf}h1{font-size:1.7rem;letter-spacing:-.04em}p{color:#b3c7d3;line-height:1.55}label{display:block;margin:1.2rem 0 .4rem;font-size:.89rem}input{width:100%;font:inherit;font-size:16px;border:1px solid #355268;border-radius:8px;background:#0b1422;color:white;padding:.9rem}button{width:100%;padding:.9rem;margin-top:1.2rem;border:0;border-radius:8px;color:#052225;font-weight:700;background:#5de4d2;cursor:pointer;font:inherit}button:disabled{opacity:.6;cursor:wait}#message{margin-top:1rem;line-height:1.5}#message.error{color:#ffabb3}#message.success{color:#86efac}.links{margin-top:1.5rem;font-size:.92rem}
</style><link rel="stylesheet" href="css/pro-terminal.css">
</head><body class="stockai-pro"><main>
<a href="login.html">← Back to sign in</a><h1>Create a new password</h1><p>Choose a new password for your StockAI account. The reset link works once and expires after 30 minutes.</p>
<form id="reset-form"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<button type="submit" id="submit">Update password</button></form><div id="message" role="status" aria-live="polite"></div></main>
<script src="js/auth.js"></script><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');
if (location.hash) history.replaceState(null,'',location.pathname);
if (!token || !/^[0-9a-f]{64}$/.test(token)) {
 document.getElementById('message').textContent='This reset link is invalid. Request a new one from the sign-in page.';
 document.getElementById('message').className='error';
 document.getElementById('reset-form').hidden=true;
}
document.getElementById('reset-form').addEventListener('submit',async e=>{
 e.preventDefault();const pass=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 const message=document.getElementById('message'),btn=document.getElementById('submit');
 if(pass!==confirm){message.className='error';message.textContent='Passwords do not match.';return;}
 btn.disabled=true;message.textContent='Updating…';
 const result=await Auth.resetPassword(token,pass);
 message.className=result.success?'success':'error';
 message.textContent=result.success?'Password changed. You can now return to the login page.':result.error;
 btn.disabled=false;
 if(result.success){document.getElementById('reset-form').hidden=true;}
});
</script></body></html>
