name: StockAI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend and backend syntax
        shell: bash
        run: |
          node --check server.js
          node --check sw.js
          for file in js/*.js tests/*.cjs; do node --check "$file"; done
      - name: Run regression tests
        run: npm test
      - name: Inspect production dependency advisories (public launch blocker)
        continue-on-error: true
        shell: bash
        run: |
          npm audit --omit=dev --json > runtime-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync('runtime-audit.json','utf8')); }
          catch (_) { console.log('Production audit unavailable; check npm registry connectivity.'); process.exit(1); }
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Production dependency audit:', counts);
          const rows = Object.entries(report.vulnerabilities || {});
          rows.sort((a,b)=>({critical:0,high:1,moderate:2,low:3,info:4}[a[1]?.severity]||5)-({critical:0,high:1,moderate:2,low:3,info:4}[b[1]?.severity]||5));
          for(const [name,entry] of rows.slice(0,40)) {
            console.log(entry.severity.toUpperCase(), name, 'fix available:', JSON.stringify(entry.fixAvailable));
          }
          if ((counts.critical || 0) + (counts.high || 0) > 0)
            console.log('WARNING: high/critical production dependency advisories remain. Do not enable public registration yet.');
          NODE
      - name: Generate a safe lockfile audit-fix candidate (diagnostic only)
        continue-on-error: true
        shell: bash
        run: |
          cp package-lock.json original-package-lock.json
          npm audit fix --package-lock-only --omit=dev --ignore-scripts || true
          npm audit --omit=dev --json > candidate-audit.json || true
          node - <<'NODE'
          const fs=require('node:fs');
          const original=fs.readFileSync('original-package-lock.json','utf8');
          const candidate=fs.readFileSync('package-lock.json','utf8');
          const audit=JSON.parse(fs.readFileSync('candidate-audit.json','utf8'));
          console.log('Audit fix changed the lockfile:',original!==candidate);
          console.log('Candidate production vulnerabilities:',audit.metadata?.vulnerabilities);
          NODE
      - name: Upload candidate fixed lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-fix-candidate-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Upload production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-npm-audit
          path: runtime-audit.json
          if-no-files-found: ignore
