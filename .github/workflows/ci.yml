name: StockAI CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend and backend syntax
        shell: bash
        run: |
          node --check server.js
          node --check sw.js
          for file in js/*.js tests/*.cjs; do node --check "$file"; done
      - name: Run regression tests
        run: npm test
      - name: Enforce zero production dependency advisories
        # This is a release-blocking check. Do not mark audit failures as green.
        shell: bash
        run: |
          npm audit --omit=dev --json > runtime-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          let report = {};
          try { report = JSON.parse(fs.readFileSync('runtime-audit.json','utf8')); }
          catch (_) { console.log('Production audit unavailable; check npm registry connectivity.'); process.exit(1); }
          const counts = report.metadata?.vulnerabilities || {};
          console.log('Production dependency audit:', counts);
          const rows = Object.entries(report.vulnerabilities || {});
          rows.sort((a,b)=>({critical:0,high:1,moderate:2,low:3,info:4}[a[1]?.severity]||5)-({critical:0,high:1,moderate:2,low:3,info:4}[b[1]?.severity]||5));
          for(const [name,entry] of rows.slice(0,40)) {
            console.log(entry.severity.toUpperCase(), name, 'fix available:', JSON.stringify(entry.fixAvailable));
          }
          const count = ['critical','high','moderate','low'].reduce((total,k)=>total+(counts[k]||0),0);
          if (count > 0) {
            console.error('BLOCKED: '+count+' production dependency advisories remain. Public launch is not approved.');
            process.exitCode = 1;
          } else {
            console.log('PASS: no currently reported production dependency advisories.');
          }
          NODE
      - name: Upload production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-npm-audit
          path: runtime-audit.json
          if-no-files-found: ignore
